<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Карта сайта — АГРО АС</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 40px 20px 60px;
			font-family: 'Manrope', Arial, sans-serif;
			font-size: 16px;
			line-height: 1.4;
			color: #3d3d3d;
			background: #eff3eb;
		}

		.sitemap {
			max-width: 420px;
			margin: 0 auto;
		}

		.sitemap__title {
			margin: 0 0 8px;
			font-size: 22px;
			font-weight: 600;
			color: #052d24;
		}

		.sitemap__note {
			margin: 0 0 24px;
			font-size: 14px;
			color: #6b6b6b;
		}

		.sitemap__list {
			margin: 0;
			padding: 0;
			list-style: none;
			border: 1px solid #d4ddd0;
			border-radius: 8px;
			background: #fff;
			overflow: hidden;
			counter-reset: sitemap;
		}

		.sitemap__item {
			border-top: 1px solid #e8ede4;
		}

		.sitemap__item:first-child {
			border-top: none;
		}

		.sitemap__link {
			display: block;
			padding: 12px 16px;
			color: #052d24;
			text-decoration: none;
		}

		.sitemap__link::before {
			counter-increment: sitemap;
			content: counter(sitemap) ". ";
			color: #95c12e;
			font-weight: 600;
		}

		.sitemap__link:hover {
			background: #eff3eb;
			text-decoration: underline;
		}

		.sitemap__link span {
			color: #6b6b6b;
			font-size: 13px;
		}
	</style>
</head>
<body>
	<div class="sitemap">
		<h1 class="sitemap__title">АГРО АС — карта сайта</h1>
		<p class="sitemap__note">Верстка, навигация для разработки</p>
		<ul class="sitemap__list">
			<li class="sitemap__item">
				<a class="sitemap__link" href="index.html" target="_blank">Главная <span>index.html</span></a>
			</li>
			<li class="sitemap__item">
				<a class="sitemap__link" href="category.html" target="_blank">Каталог <span>category.html</span></a>
			</li>
			<li class="sitemap__item">
				<a class="sitemap__link" href="card.html" target="_blank">Карточка товара <span>card.html</span></a>
			</li>
			<li class="sitemap__item">
				<a class="sitemap__link" href="wholesale.html" target="_blank">Оптовым клиентам <span>wholesale.html</span></a>
			</li>
			<li class="sitemap__item">
				<a class="sitemap__link" href="delivery.html" target="_blank">Доставка и оплата <span>delivery.html</span></a>
			</li>
			<li class="sitemap__item">
				<a class="sitemap__link" href="contacts.html" target="_blank">Контакты <span>contacts.html</span></a>
			</li>
		</ul>
	</div>
</body>
</html>
