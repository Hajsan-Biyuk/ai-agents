# Маппинг колонок прайса → свойства каталога Bitrix (ИБ 61).
# Основной режим — совпадение по NAME свойства в Bitrix.
# overrides — для колонок с нестандартными названиями.

auto_create_unknown: true

# Текстовые значения характеристик — с заглавной буквы (карточка, фильтры)
capitalize_text_values: true

skip_name_patterns:
  - '/^фото\s*\d*/ui'
  - '/^unnamed/i'

# Колонки, которые не пишем в карточку (и очищаем при импорте)
supplier_skips:
  dk:
    - "тип"
    - "количество монтажных отверстий"
    - "область применения"
    - "встраиваемая система"
    - "количество единиц в мастер коробке"
    - "количество единиц в коробке"

# Свойства, которые всегда очищаем при импорте поставщика (даже если колонки нет в файле)
supplier_clear_codes:
  dk:
    - PROP_2033
    - PROP_1253
    - PROP_1243
    - PROP_1241
    - PROP_1270

# AllerBath: глобальные overrides уводят колонки в чужой фильтр.
supplier_overrides:
  allerbath:
    "исполнение полотна":
      code: PROP_1348
    "толщина полотна, мм":
      code: PROP_1349
    "страна производства":
      code: PROP_2084
    "гарантия":
      code: PROP_2120

overrides:
  "исполнение полотна (переименовать)":
    code: PROP_1393
  "исполнение полотна":
    code: PROP_1393
  "толщина полотна, мм":
