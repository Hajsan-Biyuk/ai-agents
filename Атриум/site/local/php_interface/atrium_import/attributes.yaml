  "ширина, мм":
    code: PROP_1403
  "размеры с диапазоном регулировок, мм":
    code: RAZMERY_S_DIAPAZONOM
  "особенности (есть множественный выбор)":
    code: OSOBENNOSTI
  "особенности":
    code: OSOBENNOSTI
  "название модели":
