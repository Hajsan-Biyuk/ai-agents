  "размер верхней лейки, мм":
    code: ATR_RAZMER_LEYKI_MM
  "форма":
    code: PROP_206
  "вес (кг)":
    code: ATRIUM_WEIGHT_KG
  "вес, кг":
    code: ATRIUM_WEIGHT_KG
  "объем м3":
    code: ATRIUM_VOLUME_M3
  "объем, м3":
    code: ATRIUM_VOLUME_M3
  "высота уп. мм":
